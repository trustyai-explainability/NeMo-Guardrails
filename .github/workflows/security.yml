name: Security Scan

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Scan Python requirements
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: "v0.76.2"
          scan-type: "fs"
          scan-ref: "requirements.txt"
          scanners: "vuln"
          format: "sarif"
          output: "trivy-requirements-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan server Dockerfile
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: "v0.76.2"
          scan-type: "fs"
          scan-ref: "Dockerfile.server"
          scanners: "misconfig"
          format: "sarif"
          output: "trivy-dockerfile-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy requirements scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'develop'
        with:
          sarif_file: "trivy-requirements-results.sarif"
          category: "trivy-requirements"

      - name: Upload Trivy Dockerfile scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'develop'
        with:
          sarif_file: "trivy-dockerfile-results.sarif"
          category: "trivy-dockerfile"

  bandit-scan:
    name: Bandit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv lock --upgrade && uv sync --all-extras --group dev

      - name: Install Bandit
        run: uv run pip install bandit[sarif]

      - name: Run Bandit Security Scan
        uses: PyCQA/bandit-action@8970b6163696044b1b81bd86df0d01a7695e65df # main (2026-11-10)
        with:
          python-version: "3.12"
          targets: "."
          exclude: "tests"

      - name: Upload SARIF results to Security tab
        if: github.ref == 'refs/heads/develop'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: bandit-security-scan

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif-results
          path: results.sarif
          retention-days: 30
        continue-on-error: true
