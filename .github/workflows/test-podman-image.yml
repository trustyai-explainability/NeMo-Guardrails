name: Smoke Test Live Server

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      IMAGE: nemoguardrails-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Get runner architecture
        id: runner-arch
        run: echo "arch=$(uname -m)" >> $GITHUB_OUTPUT

      - name: Set image tags
        run: |
          ARCH=${STEPS_RUNNER_ARCH_OUTPUTS_ARCH}
          echo "TEST_TAG=${{ env.IMAGE }}:${{ github.sha }}-$ARCH" >> $GITHUB_ENV
        env:
          STEPS_RUNNER_ARCH_OUTPUTS_ARCH: ${{ steps.runner-arch.outputs.arch }}

      - name: Build image
        run: podman build --platform linux/amd64 --file Dockerfile.server --tag "${TEST_TAG}" .

      - name: Restore Hugging Face models
        id: hap-model-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/huggingface
          key: live-server-smoke-${{ runner.os }}-${{ hashFiles('tests/test_configs/live_server_smoke/config.yml', 'requirements.txt') }}
          restore-keys: |
            live-server-smoke-${{ runner.os }}-

      - name: Prepare model cache
        run: mkdir -p .cache/huggingface

      - name: Start container
        run: |
          podman run -d --name live_server_smoke \
            --network host \
            -v "${PWD}/tests/test_configs/live_server_smoke:/app/config/live_server_smoke:ro" \
            -v "${PWD}/.cache/huggingface:/app/.cache/huggingface" \
            -e CONFIG_ID=live_server_smoke \
            -e TRANSFORMERS_CACHE=/app/.cache/huggingface/transformers \
            "${TEST_TAG}"

      - name: Wait for container to be ready
        timeout-minutes: 3
        run: |
          echo "Waiting for container to be ready..."
          until curl --output /dev/null --silent --fail http://127.0.0.1:8000/v1/rails/configs; do
            printf '.'
            sleep 2
          done
          echo "Container is ready!"

      - name: Check server status
        run: |
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/v1/rails/configs)
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Server responded with code $RESPONSE_CODE."
            exit 1
          fi

      - name: Run tests
        env:
          LIVE_TEST_MODE: "1"
          NEMO_GUARDRAILS_TEST_BASE_URL: http://127.0.0.1:8000
        run: uv run --locked pytest tests/server/test_live_server_smoke.py

      - name: Save Hugging Face models
        if: steps.hap-model-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: .cache/huggingface
          key: live-server-smoke-${{ runner.os }}-${{ hashFiles('tests/test_configs/live_server_smoke/config.yml', 'requirements.txt') }}

      - name: Stop container
        if: always()
        run: podman rm --force live_server_smoke
